services:
  api:
    build:
      context: .
      dockerfile: Dockerfile  # Flask API Dockerfile
    env_file: .env
    ports:
      - "5000:5000"

  collector:
    build:
      context: .
      dockerfile: src/collector/Dockerfile  # FastAPI collector Dockerfile
    env_file: .env
    ports:
      - "8001:8001"
