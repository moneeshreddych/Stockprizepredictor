<!DOCTYPE html><html lang="en"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1.0"><title>BullInsights - Financial News</title><link rel="stylesheet" href="css/style.css"><link rel="stylesheet" href="css/news.css"></head><body class="dashboard-page"><aside class="sidebar"><div class="side-brand">BullInsights</div><nav><a href="dashboard.html">Dashboard</a><a href="#">Watchlist</a><a href="#">Portfolio</a><a href="#">Predictions</a><a class="active" href="news.html">News</a></nav></aside><div class="dash-main"><header class="dash-top"><a class="brand" href="index.html">BullInsights</a><div class="dash-links"><a href="dashboard.html">Dashboard</a><a href="#">Stocks</a><a href="#">Mutual Funds</a><a class="active-link" href="news.html">News</a></div></header><main class="dash-content news-page-content"><div class="overview-head"><div><h1>Latest Financial News</h1><p>Market and company news collected from your Supabase database.</p></div><button class="btn secondary" data-news-refresh>Refresh</button></div><section class="card news-full-card"><div class="news-page-head"><div><strong data-news-page>Page 1</strong><small class="news-status">Loading news...</small></div><span>100 articles per page</span></div><div class="news-list news-full-list"></div><div class="news-pagination"><button class="btn secondary" data-news-prev>← Previous</button><div class="news-page-buttons" data-news-pages></div><button class="btn secondary" data-news-next>Next →</button></div></section></main></div><script src="js/news-renderer.js"></script><script>document.addEventListener('DOMContentLoaded',()=>{const list=document.querySelector('.news-full-list'),status=document.querySelector('.news-status'),pageLabel=document.querySelector('[data-news-page]'),prev=document.querySelector('[data-news-prev]'),next=document.querySelector('[data-news-next]'),pages=document.querySelector('[data-news-pages]'),refresh=document.querySelector('[data-news-refresh]');const limit=100;let current=1,hasNext=false;function render(){pageLabel.textContent=`Page ${current}`;prev.disabled=current===1;next.disabled=!hasNext;pages.innerHTML='';for(let p=Math.max(1,current-2);p<=current+2;p++){const b=document.createElement('button');b.textContent=p;b.className=p===current?'selected':'';b.onclick=()=>load(p);pages.appendChild(b)}}async function load(page=1){current=page;status.textContent='Loading news...';list.innerHTML='<div class="news-empty">Loading financial news...</div>';try{const r=await fetch(`/api/news?page=${page}&limit=${limit}`);if(!r.ok)throw Error(`HTTP ${r.status}`);const x=await r.json(),a=x.data||[];hasNext=Boolean(x.has_next);list.innerHTML='';if(!a.length)list.innerHTML='<div class="news-empty">No news available.</div>';a.forEach(v=>{const card=typeof renderNewsArticle==='function'?renderNewsArticle(v):null;if(card)list.appendChild(card)});status.textContent=a.length?`${a.length} stories on this page`:'No news available';render();window.scrollTo({top:0,behavior:'smooth'})}catch(err){console.error(err);list.innerHTML='<div class="news-empty">Unable to load news. Make sure the Flask API is running.</div>';status.textContent='News unavailable'}}prev.onclick=()=>{if(current>1)load(current-1)};next.onclick=()=>{if(hasNext)load(current+1)};refresh.onclick=()=>load(current);load()});</script></body></html>
