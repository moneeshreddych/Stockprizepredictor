services:
  - type: keyvalue
    name: bullinsights-cache
    plan: free
    maxmemoryPolicy: allkeys-lru

  - type: web
    name: bullinsights-api
    runtime: python
    buildCommand: pip install -r requirements-cloudrun.txt
    startCommand: gunicorn api.market_server:app --bind 0.0.0.0:$PORT
    envVars:
      - key: SUPABASE_URL
        sync: false
      - key: SUPABASE_SECRET_KEY
        sync: false
      - key: FINNHUB_API_KEY
        sync: false
      - key: ALPACA_API_KEY
        sync: false
      - key: ALPACA_SECRET_KEY
        sync: false
      - key: REDIS_URL
        fromService:
          type: keyvalue
          name: bullinsights-cache
          property: connectionString
